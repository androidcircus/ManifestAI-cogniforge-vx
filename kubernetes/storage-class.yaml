# Worker nodes must create the mount point (done by deploy-cluster.sh too):
#   mkdir -p /mnt/nvme
#
# Example PVC used by the Argo pipeline to persist generated videos:
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rack-outputs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-nvme
  resources:
    requests:
      storage: 100Gi
