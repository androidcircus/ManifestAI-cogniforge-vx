# kubernetes/storage-class.yaml
# Local NVMe storage for pipeline outputs.
#
# Each GPU worker VM has a 1 TiB data disk (see provisioning/Vagrantfile,
# lv.machine_virtual_size = 1024). We bind-mount /mnt/nvme on each node and
# expose it as a local PersistentVolume so Argo output artifacts land on
# node-local fast storage.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-nvme
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nvme-worker-01
spec:
  capacity:
    storage: 1Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-nvme
  local:
    path: /mnt/nvme
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cogniforge-worker-01
---
